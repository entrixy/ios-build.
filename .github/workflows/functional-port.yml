name: iPhone build and complete application checks
"on":
  push:
    branches: [ci/functional-port, ci/automation-runtime, ci/ui-review, ci/ui-review-arm, ci/native-review-arm, ci/review-batch]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: functional-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ENTRIXY_TEST_PROJECT: EntrixyPersonal.xcodeproj
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare evidence
        run: |
          mkdir -p .local-checks/ci
          xcodebuild -version | tee .local-checks/ci/toolchain.log
      - name: Test protocol core with Apple CryptoKit
        run: swift test 2>&1 | tee .local-checks/ci/core.log
      - name: Prepare healthy job-owned simulator before compilation
        id: simulator_prepare
        timeout-minutes: 25
        continue-on-error: true
        run: python3 scripts/prepare_review_simulator.py 2>&1 | tee .local-checks/ci/simulator-prepare.log
      - name: Install project generator and isolated spec reader
        run: |
          brew install xcodegen
          python3 -m venv .local-checks/python
          .local-checks/python/bin/pip install PyYAML==6.0.3
      - name: Generate Store and personal application projects
        run: |
          xcodegen generate
          .local-checks/python/bin/python scripts/prepare_personal_project.py
          xcodegen generate --spec project.personal.json
      - name: Compile personal application and all test products once
        id: debug_build
        timeout-minutes: 30
        run: |
          xcodebuild -project EntrixyPersonal.xcodeproj -scheme EntrixyTests \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .local-checks/SourcePackages \
            -derivedDataPath .local-checks/DerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing 2>&1 | tee .local-checks/ci/debug-build.log
      - name: Verify corrected decoder and modal interactions on the compiled application
        id: corrected_scenarios
        if: ${{ always() && steps.debug_build.outcome == 'success' && steps.simulator_prepare.outcome == 'success' }}
        run: |
          python3 scripts/test_simulator.py --use-built-tests \
            --prepared-device .local-checks/ci/prepared-device.json --keep-prepared-device \
            --test EntrixyAppTests/CameraVideoProxyTests/testActualDASHDecoderDisplaysFramesFromProtectedManifestAndSegments \
            --test EntrixyAppTests/CameraVideoProxyTests/testActualWebMDecoderDisplaysFramesThroughAuthenticatedHTTPBridge \
            --test EntrixyAppTests/CameraVideoProxyTests/testDecoderMayAbandonAReadForASeekWithoutFailingCameraButRemoteErrorsStillFail \
            --test EntrixyUITests/NavigationUITests/testAvatarPickerOpensFromAvatarAndKeepsObjectRow \
            --test EntrixyUITests/NavigationUITests/testGuestPhoneRequestOffersExplicitCallAndDeclineWithoutTelephoneHandoff \
            --test EntrixyUITests/NavigationUITests/testServerDeletionRequiresConfirmationAndReportsPendingWithoutClaimingErasure \
            2>&1 | tee .local-checks/ci/corrected-scenarios.log
      - name: Compile normal Store Release and verify fixture and privacy isolation
        id: release_build
        timeout-minutes: 30
        if: ${{ always() && steps.debug_build.outcome == 'success' && steps.corrected_scenarios.outcome == 'success' }}
        run: |
          xcodebuild -project Entrixy.xcodeproj -scheme Entrixy \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .local-checks/SourcePackages \
            -derivedDataPath .local-checks/ReleaseDerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build 2>&1 | tee .local-checks/ci/release-build.log
          python3 scripts/verify_release_isolation.py \
            .local-checks/DerivedData/Build/Products/Debug-iphonesimulator/Entrixy.app \
            .local-checks/ReleaseDerivedData/Build/Products/Release-iphonesimulator/Entrixy.app
      - name: Archive real arm64 personal Release and package IPA for local signing
        id: personal_package
        timeout-minutes: 35
        if: ${{ always() && steps.debug_build.outcome == 'success' && steps.release_build.outcome == 'success' }}
        run: python3 scripts/package_personal_ipa.py 2>&1 | tee .local-checks/ci/personal-package.log
      - name: Run complete hosted and UI suite without product screenshots
        id: application_tests
        if: ${{ always() && steps.debug_build.outcome == 'success' && steps.corrected_scenarios.outcome == 'success' }}
        run: python3 scripts/test_simulator.py --use-built-tests --complete-suite --prepared-device .local-checks/ci/prepared-device.json --keep-prepared-device 2>&1 | tee .local-checks/ci/application-tests.log
      - name: Retain install package only after all mandatory checks succeed
        if: ${{ success() && steps.personal_package.outcome == 'success' && steps.application_tests.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Entrixy-iPhone11-personal-IPA
          path: .local-checks/ci/iphone11/
          if-no-files-found: error
          retention-days: 14
      - name: Release job-owned simulator
        if: always()
        run: python3 scripts/prepare_review_simulator.py --cleanup
      - name: Retain build and transaction evidence without a screenshot gallery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iphone11-build-evidence
          path: |
            .local-checks/ci/*.log
            .local-checks/ci/*.json
            .local-checks/ci/iphone11/package.json
            .local-checks/ci/ui-failure-attachments/
          if-no-files-found: warn
          retention-days: 7
      - name: Require healthy simulator for complete acceptance
        if: ${{ always() && steps.simulator_prepare.outcome != 'success' }}
        run: |
          echo 'Simulator preparation failed; complete application checks were not executed.' >&2
          exit 1
