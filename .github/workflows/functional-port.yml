name: iPhone install package with verified runtime evidence
"on":
  push:
    branches: [ci/functional-port, ci/automation-runtime, ci/ui-review, ci/ui-review-arm, ci/native-review-arm, ci/review-batch]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: functional-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ENTRIXY_TEST_PROJECT: EntrixyPersonal.xcodeproj
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare evidence
        run: |
          mkdir -p .local-checks/ci
          xcodebuild -version | tee .local-checks/ci/toolchain.log
      - name: Retrieve immutable complete-run evidence for bounded follow-up
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14758179556
          merge-multiple: true
          run-id: 45022342509
          github-token: ${{ github.token }}
          path: .local-checks/PreviousCompleteEvidence
      - name: Retrieve passed follow-up evidence for unchanged application source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14761867849
          merge-multiple: true
          run-id: 45034724769
          github-token: ${{ github.token }}
          path: .local-checks/PassedFollowupEvidence
      - name: Verify source identity and immutable complete plus follow-up evidence
        id: application_tests
        run: |
          python3 scripts/verify_runtime_followup.py \
            --baseline-evidence .local-checks/PreviousCompleteEvidence \
            --retained-followup-evidence .local-checks/PassedFollowupEvidence \
            2>&1 | tee .local-checks/ci/runtime-coverage.log
      - name: Install project generator and isolated spec reader
        run: |
          brew install xcodegen
          python3 -m venv .local-checks/python
          .local-checks/python/bin/pip install PyYAML==6.0.3
      - name: Generate Store and personal application projects
        run: |
          xcodegen generate
          .local-checks/python/bin/python scripts/prepare_personal_project.py
          xcodegen generate --spec project.personal.json
      - name: Compile personal Debug comparison product without repeating passed tests
        id: debug_build
        timeout-minutes: 30
        run: |
          xcodebuild -project EntrixyPersonal.xcodeproj -scheme Entrixy \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .local-checks/SourcePackages \
            -derivedDataPath .local-checks/DerivedData \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build 2>&1 | tee .local-checks/ci/debug-build.log
      - name: Archive real arm64 personal Release and package IPA for local signing
        id: personal_package
        timeout-minutes: 35
        if: ${{ always() && steps.debug_build.outcome == 'success' && steps.application_tests.outcome == 'success' }}
        run: python3 scripts/package_personal_ipa.py 2>&1 | tee .local-checks/ci/personal-package.log
      - name: Retain install package only after all mandatory checks succeed
        if: ${{ success() && steps.personal_package.outcome == 'success' && steps.application_tests.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Entrixy-iPhone11-personal-IPA
          path: .local-checks/ci/iphone11/
          if-no-files-found: error
          retention-days: 14
      - name: Retain build and transaction evidence without a screenshot gallery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iphone11-build-evidence
          path: |
            .local-checks/ci/*.log
            .local-checks/ci/*.json
            .local-checks/ci/*.jsonl
            .local-checks/ci/iphone11/package.json
            .local-checks/ci/ui-failure-attachments/
          if-no-files-found: warn
          retention-days: 7
