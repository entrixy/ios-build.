name: iOS functional port compilation
"on":
  push:
    branches: [ci/functional-port, ci/automation-runtime, ci/ui-review, ci/ui-review-arm, ci/native-review-arm, ci/review-batch]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: functional-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ${{ (github.ref == 'refs/heads/ci/ui-review-arm' || github.ref == 'refs/heads/ci/native-review-arm') && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      # Reproduce the actual reset/settings regressions before the full batch.
      # '1' is diagnosis only; 'preflight' continues into complete acceptance.
      ENTRIXY_REVIEW_PREFLIGHT: 'preflight'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare evidence
        run: |
          mkdir -p .local-checks/ci
          xcodebuild -version | tee .local-checks/ci/toolchain.log
      - name: Test protocol core with Apple CryptoKit
        if: env.ENTRIXY_REVIEW_PREFLIGHT != '1'
        run: swift test 2>&1 | tee .local-checks/ci/core.log
      - name: Prepare healthy simulator before compiling application products
        id: simulator_prepare
        timeout-minutes: 25
        # Retain independent SDK/archive results if the hosted UI service fails.
        # The explicit acceptance gate below still fails the overall review.
        continue-on-error: true
        if: github.ref == 'refs/heads/ci/review-batch'
        run: python3 scripts/prepare_review_simulator.py 2>&1 | tee .local-checks/ci/simulator-prepare.log
      - name: Retain simulator preparation evidence before compilation
        if: always() && github.ref == 'refs/heads/ci/review-batch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: simulator-readiness-evidence
          path: |
            .local-checks/ci/simulator-prepare.log
            .local-checks/ci/simulator-runtimes.json
            .local-checks/ci/prepared-device.json
            .local-checks/ci/simulator-preflight.png
          retention-days: 3
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Compile application and test bundles without launching scenarios
        id: debug_build
        timeout-minutes: 30
        run: |
          xcodebuild -project Entrixy.xcodeproj -scheme EntrixyTests \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .local-checks/DerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing 2>&1 | tee .local-checks/ci/debug-build.log
      - name: Verify native transactions without capture or UI automation
        if: ${{ !startsWith(github.ref, 'refs/heads/ci/ui-review') && github.ref != 'refs/heads/ci/review-batch' }}
        run: python3 scripts/test_simulator.py --only-native --use-built-tests 2>&1 | tee .local-checks/ci/native-tests.log
      - name: Verify native UI routes without taking a product screenshot batch
        if: startsWith(github.ref, 'refs/heads/ci/ui-review')
        run: python3 scripts/test_simulator.py --only-ui --use-built-tests 2>&1 | tee .local-checks/ci/ui-tests.log
      - name: Verify local reset and English return navigation before full review
        if: github.ref == 'refs/heads/ci/review-batch' && env.ENTRIXY_REVIEW_PREFLIGHT != '' && steps.simulator_prepare.outcome == 'success'
        run: |
          python3 scripts/test_simulator.py --only-ui --use-built-tests --prepared-device .local-checks/ci/prepared-device.json --keep-prepared-device \
            --test EntrixyUITests/NavigationUITests/testLocalResetRequiresTypedConfirmationAndDoesNotExposeOldAccess \
            --test EntrixyUITests/NavigationUITests/testEnglishKeyImportMessagesAndPrivacyUseSelectedLanguageWithoutOpeningExternalContent \
            2>&1 | tee .local-checks/ci/review-preflight.log
      - name: Retain focused diagnosis before the complete acceptance pass
        if: always() && github.ref == 'refs/heads/ci/review-batch' && env.ENTRIXY_REVIEW_PREFLIGHT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-preflight-evidence
          path: .local-checks/ci/
          retention-days: 3
      - name: Verify native and UI scenarios with original screenshots in the same simulator pass
        if: github.ref == 'refs/heads/ci/review-batch' && env.ENTRIXY_REVIEW_PREFLIGHT != '1' && steps.simulator_prepare.outcome == 'success'
        run: python3 scripts/test_simulator.py --use-built-tests --review-captures --prepared-device .local-checks/ci/prepared-device.json --keep-prepared-device 2>&1 | tee .local-checks/ci/combined-review.log
      - name: Retain compilation evidence
        # Store candidates use the native renderer after the complete UI pass.
        # Keep them separate from the one-PNG-per-state review gallery.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: functional-port-build-evidence
          path: .local-checks/ci/
          retention-days: 3
      - name: Capture original Store-format JPEG candidates without modifying images
        if: github.ref == 'refs/heads/ci/review-batch' && env.ENTRIXY_REVIEW_PREFLIGHT != '1' && steps.simulator_prepare.outcome == 'success'
        run: python3 scripts/capture_store_assets.py --prepared-device .local-checks/ci/prepared-device.json 2>&1 | tee .local-checks/ci/store-assets.log
      - name: Retain original Store-format screenshot candidates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: store-screenshot-candidates
          path: |
            .local-checks/ci/store-assets/
            .local-checks/ci/store-assets.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Release job-owned simulator before Release compilation
        if: always() && github.ref == 'refs/heads/ci/review-batch'
        run: python3 scripts/prepare_review_simulator.py --cleanup
      - name: Compile Release and verify fixture isolation
        id: release_build
        timeout-minutes: 25
        if: ${{ always() && steps.debug_build.outcome == 'success' && !startsWith(github.ref, 'refs/heads/ci/ui-review') && env.ENTRIXY_REVIEW_PREFLIGHT != '1' }}
        run: |
          xcodebuild -project Entrixy.xcodeproj -scheme Entrixy \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .local-checks/ReleaseDerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build 2>&1 | tee .local-checks/ci/release-build.log
          python3 scripts/verify_release_isolation.py \
            .local-checks/DerivedData/Build/Products/Debug-iphonesimulator/Entrixy.app \
            .local-checks/ReleaseDerivedData/Build/Products/Release-iphonesimulator/Entrixy.app
      - name: Archive unsigned Release for physical iPhone and verify app/widget packaging
        if: ${{ always() && github.ref == 'refs/heads/ci/review-batch' && steps.debug_build.outcome == 'success' && steps.release_build.outcome == 'success' }}
        run: python3 scripts/archive_device_release.py 2>&1 | tee .local-checks/ci/device-release.log
      - name: Retain physical iPhone archive evidence
        if: always() && github.ref == 'refs/heads/ci/review-batch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iphone-release-evidence
          path: |
            .local-checks/ci/device-release.*
            .local-checks/ci/release-build.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Require healthy simulator for complete review acceptance
        if: ${{ always() && github.ref == 'refs/heads/ci/review-batch' && steps.simulator_prepare.outcome != 'success' }}
        run: |
          echo 'Simulator preparation failed; native/UI review acceptance was not executed.' >&2
          exit 1
