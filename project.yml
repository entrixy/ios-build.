name: Entrixy
options:
  developmentLanguage: ru
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  EntrixyCore:
    path: .
targets:
  Entrixy:
    type: application
    platform: iOS
    sources:
      - path: App
        includes:
          - '*.swift'
      - path: App/Assets.xcassets
      - path: App/Resources
      - path: WidgetShared
      - path: WidgetResources
    dependencies:
      - package: EntrixyCore
        product: EntrixyCore
      - target: EntrixyWidget
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.entrixy.ios
        'CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]': scripts/device.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': scripts/simulator.entitlements
        'CODE_SIGN_IDENTITY[sdk=iphonesimulator*]': '-'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Сканирование QR-кодов ключей, компаний и контроллеров Entrixy
    info:
      path: .local-checks/Entrixy-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.entrixy.ios.invite
            CFBundleURLSchemes: [entrixy]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Entrixy Encrypted Backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.entrixy.ios.backup, com.entrixy.android.backup]
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.entrixy.ios.backup
            UTTypeDescription: Entrixy iOS Backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [eib]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.entrixy.android.backup
            UTTypeDescription: Entrixy Android Backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [ekb]
        CFBundleDisplayName: Entrixy
        CFBundleLocalizations: [en, ru, de, es, fr, pt, zh]
        NSMotionUsageDescription: Обнаружение зависших координат при движении телефона для настроенных вами геоправил
        NSCameraUsageDescription: Сканирование QR-кодов ключей, компаний и контроллеров Entrixy
        NSBluetoothAlwaysUsageDescription: Поиск, привязка и управление вашими контроллерами Entrixy поблизости
        NSFaceIDUsageDescription: Вход в Entrixy и подтверждение действий с объектами
        NSLocationWhenInUseUsageDescription: Координаты объекта, маршруты подхода и условия автоматического управления
        NSLocationAlwaysAndWhenInUseUsageDescription: Выполнение настроенных вами правил приближения к объекту, когда приложение свёрнуто
        UIBackgroundModes: [location, bluetooth-central]
        NSLocalNetworkUsageDescription: Соединение с вашими контроллерами, вебхуками и камерами в локальной сети
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  EntrixyWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Widget
      - path: WidgetShared
      - path: WidgetResources
      - path: App/Assets.xcassets
      - path: WidgetAssets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.entrixy.ios.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) WIDGET_EXTENSION'
        CODE_SIGN_ENTITLEMENTS: scripts/widget.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: .local-checks/EntrixyWidget-Info.plist
      properties:
        CFBundleDisplayName: Entrixy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  EntrixyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/EntrixyAppTests]
    dependencies:
      - target: Entrixy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.entrixy.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  EntrixyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/EntrixyUITests]
    dependencies:
      - target: Entrixy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.entrixy.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Entrixy:
    build:
      targets:
        Entrixy: all
  EntrixyTests:
    build:
      targets:
        Entrixy: all
        EntrixyAppTests: [test]
        EntrixyUITests: [test]
    test:
      targets: [EntrixyAppTests, EntrixyUITests]
      gatherCoverageData: false
