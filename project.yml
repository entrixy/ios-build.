name: Entrixy
options:
  developmentLanguage: ru
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  EntrixyCore:
    path: .
targets:
  Entrixy:
    type: application
    platform: iOS
    sources:
      - path: App
        includes:
          - '*.swift'
      - path: App/Assets.xcassets
      - path: App/Resources
    dependencies:
      - package: EntrixyCore
        product: EntrixyCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.entrixy.ios
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': scripts/simulator.entitlements
        'CODE_SIGN_IDENTITY[sdk=iphonesimulator*]': '-'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Сканирование QR-кода гостевого ключа Entrixy
    info:
      path: .local-checks/Entrixy-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.entrixy.ios.invite
            CFBundleURLSchemes: [entrixy]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.entrixy.ios.backup
            UTTypeDescription: Entrixy iOS Backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [eib]
        CFBundleDisplayName: Entrixy
        CFBundleLocalizations: [ru]
        NSCameraUsageDescription: Сканирование QR-кода гостевого ключа Entrixy
        NSBluetoothAlwaysUsageDescription: Поиск, привязка и управление вашими контроллерами Entrixy поблизости
        NSFaceIDUsageDescription: Подтверждение действий с объектами Entrixy
  EntrixyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/EntrixyAppTests]
    dependencies:
      - target: Entrixy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.entrixy.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Entrixy:
    build:
      targets:
        Entrixy: all
  EntrixyTests:
    build:
      targets:
        Entrixy: all
        EntrixyAppTests: [test]
    test:
      targets: [EntrixyAppTests]
      gatherCoverageData: false
